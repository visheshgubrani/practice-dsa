<!doctype html>
<html lang="en">
  <!--
    The execution-trace frame.

    Same-origin by design: the workspace posts a trace in and the vendored
    visualizer draws it. The parent owns the request to the engine; this page
    owns nothing but the drawing. See ./README.md for provenance.

    Protocol (both directions, always same-origin):
      parent -> frame   { type: "dsa:current-step" }
      parent -> frame   { type: "dsa:trace", code, trace, options, epoch }
      frame  -> parent  { type: "dsa:ready", epoch }
      frame  -> parent  { type: "dsa:rendered", epoch, steps }
      frame  -> parent  { type: "dsa:error", epoch, message }
      frame  -> parent  { type: "dsa:step", step }

    The visualizer takes `{code, trace}` — the code pane is drawn from `code`,
    and the trace is a bare array of steps. The parent sends both.
  -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Execution trace</title>
    <link rel="stylesheet" href="./pytutor.css" />
    <style>
      /* The visualizer's own palette is light; the frame stays light so the
         vendored stylesheet reads as intended rather than as a broken card. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #111;
      }
      #visualizerDiv {
        padding: 6px 10px 48px;
      }
      /* Keep the two execution markers in their own cells. Python Tutor still
         measures its original gutter during rendering, so hide it without
         removing it from layout (display: none breaks its alignment checks). */
      #visualizerDiv #gutterTD,
      #visualizerDiv #leftCodeGutterSVG {
        visibility: hidden !important;
      }
      #visualizerDiv table#pyCodeOutput td.dsa-arrow-cell {
        box-sizing: border-box !important;
        width: 13px !important;
        min-width: 13px !important;
        max-width: 13px !important;
        padding: 0 !important;
        position: relative;
        vertical-align: middle !important;
      }
      #visualizerDiv .dsa-arrow-marker {
        border-bottom: 5px solid transparent;
        border-left: 7px solid transparent;
        border-top: 5px solid transparent;
        height: 0;
        left: 3px;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        visibility: hidden;
        width: 0;
      }
      #visualizerDiv .dsa-arrow-cell--previous .dsa-arrow-marker {
        border-left-color: #c9e6ca;
      }
      #visualizerDiv .dsa-arrow-cell--current .dsa-arrow-marker {
        border-left-color: #e93f34;
      }
      #visualizerDiv .dsa-arrow-cell--visible .dsa-arrow-marker {
        visibility: visible;
      }
      #frameError {
        display: none;
        margin: 10px;
        padding: 9px 12px;
        border: 1px solid #e3b7b7;
        border-radius: 6px;
        background: #fff6f6;
        color: #7a2020;
        font: 13px/1.5 verdana, arial, helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="frameError"></div>
    <div id="visualizerDiv"></div>
    <script src="./pytutor-embed.bundle.js"></script>
    <script>
      (function () {
        var current = null;
        var epoch = null;

        function post(message) {
          if (window.parent === window) return;
          window.parent.postMessage(message, window.location.origin);
        }

        function fail(message) {
          var box = document.getElementById("frameError");
          box.textContent = message;
          box.style.display = "block";
          post({ type: "dsa:error", epoch: epoch, message: message });
        }

        function setArrowMarkers(visualizer) {
          var table = document.querySelector(
            "#visualizerDiv table#pyCodeOutput",
          );
          if (!table) return;

          var rows = table.querySelectorAll("tr");
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var lineNumberCell = row.querySelector("td.lineNo");
            if (!lineNumberCell) continue;

            var previousCell = row.querySelector(
              "td.dsa-arrow-cell--previous",
            );
            if (!previousCell) {
              previousCell = document.createElement("td");
              previousCell.className =
                "dsa-arrow-cell dsa-arrow-cell--previous";
              previousCell.setAttribute("aria-hidden", "true");
              previousCell.innerHTML = '<span class="dsa-arrow-marker"></span>';
              row.insertBefore(previousCell, lineNumberCell);
            }

            var currentCell = row.querySelector(
              "td.dsa-arrow-cell--current",
            );
            if (!currentCell) {
              currentCell = document.createElement("td");
              currentCell.className = "dsa-arrow-cell dsa-arrow-cell--current";
              currentCell.setAttribute("aria-hidden", "true");
              currentCell.innerHTML = '<span class="dsa-arrow-marker"></span>';
              row.insertBefore(currentCell, lineNumberCell);
            }

            previousCell.classList.remove("dsa-arrow-cell--visible");
            currentCell.classList.remove("dsa-arrow-cell--visible");
          }

          function markerForLine(lineNumber, markerClass) {
            if (
              typeof lineNumber !== "number" ||
              !Number.isInteger(lineNumber) ||
              lineNumber < 1
            ) {
              return;
            }

            var lineCell = table.querySelector("#lineNo" + lineNumber);
            if (!lineCell || !table.contains(lineCell)) return;
            var markerCell = lineCell.parentElement.querySelector(
              "td.dsa-arrow-cell--" + markerClass,
            );
            if (markerCell) {
              markerCell.classList.add("dsa-arrow-cell--visible");
            }
          }

          // These values are computed by Python Tutor, including its special
          // call-site line for a returning function. Keep that semantics intact.
          markerForLine(visualizer.prevLineNumber, "previous");
          markerForLine(visualizer.curLineNumber, "current");
        }

        function draw(data) {
          epoch = typeof data.epoch === "number" ? data.epoch : null;

          if (typeof window.addVisualizerToPage !== "function") {
            fail("The visualizer bundle did not load.");
            return;
          }
          var trace = data.trace;
          var code = data.code;
          if (!Array.isArray(trace) || !trace.length || typeof code !== "string") {
            fail("The frame was given no trace to draw.");
            return;
          }

          try {
            document.getElementById("frameError").style.display = "none";
            document.getElementById("visualizerDiv").innerHTML = "";
            var options = data.options || {};
            var suppliedUpdateOutputCallback = options.updateOutputCallback;
            options.embeddedMode = true;
            options.updateOutputCallback = function (visualizer) {
              if (typeof suppliedUpdateOutputCallback === "function") {
                suppliedUpdateOutputCallback(visualizer);
              }
              setArrowMarkers(visualizer);
            };
            current = window.addVisualizerToPage(
              { code: code, trace: trace },
              "visualizerDiv",
              options,
            );
          } catch (error) {
            current = null;
            // Python Tutor's assertions throw strings rather than Error objects.
            var detail =
              error && typeof error.message === "string"
                ? error.message
                : typeof error === "string"
                  ? error
                  : "";
            fail(
              detail
                ? "The trace could not be drawn: " + detail
                : "The trace could not be drawn.",
            );
          }
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin) return;
          var data = event.data;
          if (!data || typeof data !== "object") return;

          if (data.type === "dsa:current-step") {
            post({ type: "dsa:step", step: current ? current.curInstr : 0 });
            return;
          }
          if (data.type === "dsa:trace") draw(data);
        });

        // The parent answers this with the trace, so neither side has to guess
        // whether the other's listener is attached yet.
        post({ type: "dsa:ready" });
      })();
    </script>
  </body>
</html>
